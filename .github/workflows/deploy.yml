name: Ordens Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to publish Ordens'
        required: true
        type: string
      transport:
        description: 'Manifest transport: s3 (default) or ssm (fallback)'
        required: false
        default: s3
        type: choice
        options:
          - s3
          - ssm

permissions:
  contents: read

concurrency:
  group: ordens-deploy
  cancel-in-progress: false

env:
  SOLUTION: Oficina.OrdensServico.sln
  MIN_COVERAGE: "80"
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  bdd:
    name: Distributed BDD
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ESTOQUE_REPOSITORY: ${{ vars.ESTOQUE_REPOSITORY }}
      ESTOQUE_REF: ${{ vars.ESTOQUE_REF }}
      CADASTRO_REPOSITORY: ${{ vars.CADASTRO_REPOSITORY }}
      CADASTRO_REF: ${{ vars.CADASTRO_REF }}
    steps:
      - name: Validate request
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ github.event.inputs.confirmation }}" = "DEPLOY"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run distributed BDD
        shell: pwsh
        run: ./scripts/run-bdd.ps1
        env:
          CROSS_REPOSITORY_TOKEN: ${{ secrets.CROSS_REPOSITORY_TOKEN }}
      - name: Publish BDD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-${{ github.run_id }}
          path: artifacts/bdd
          retention-days: 7
  deploy:
    name: Deploy Ordens to K3s
    needs: bdd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET_FALLBACK: ${{ vars.TF_STATE_BUCKET }}
      MANIFEST_TRANSPORT: ${{ inputs.transport }}
    steps:
      - name: Validate request
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ github.event.inputs.confirmation }}" = "DEPLOY"
          test -n "${AWS_REGION}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Validate configuration
        shell: pwsh
        run: ./scripts/validate-official-config.ps1

      # A analise do SonarCloud e opcional. Sem SONAR_TOKEN ela e ignorada e o
      # gate local de cobertura continua valendo sozinho. Com o token presente,
      # a configuracao precisa estar completa: token sem projeto e engano de
      # configuracao, nao motivo para pular em silencio.
      - name: Resolve quality analysis mode
        id: sonar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            'enabled=false' | Add-Content -Path $env:GITHUB_OUTPUT
            'SonarCloud nao configurado: analise de qualidade ignorada. O gate local de cobertura permanece obrigatorio.' |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY
            return
          }
          foreach ($name in @('SONAR_PROJECT_KEY', 'SONAR_ORGANIZATION')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "SONAR_TOKEN esta configurado, mas a Repository Variable $name esta ausente."
            }
          }
          'enabled=true' | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Setup Java for SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SonarScanner
        if: steps.sonar.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud begin
        if: steps.sonar.outputs.enabled == 'true'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.qualitygate.wait=true

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test "$SOLUTION" --configuration Release --no-build \
            --settings .runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx"

      - name: Build coverage report
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;Cobertura;TextSummary"

      - name: Enforce coverage gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # O gate local e independente do SonarCloud: cobertura abaixo do
          # minimo reprova mesmo com o SonarCloud indisponivel.
          $reportPath = 'coverage-report/Cobertura.xml'
          if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Relatorio de cobertura nao gerado.' }
          [xml]$report = Get-Content -LiteralPath $reportPath -Raw
          $linePercentage = [Math]::Round([double]$report.coverage.'line-rate' * 100, 2)
          $minimum = [double]$env:MIN_COVERAGE
          "Line coverage: $linePercentage%" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($linePercentage -lt $minimum) {
            throw "Cobertura de linhas $linePercentage% abaixo do minimo exigido de $minimum%."
          }

      - name: Publish coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage-report
            TestResults/**/*.trx
          retention-days: 7

      - name: SonarCloud end and quality gate
        if: steps.sonar.outputs.enabled == 'true'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve platform metadata
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          identity_account="$(aws sts get-caller-identity --query Account --output text)"
          deterministic_bucket="oficina-terraform-state-${identity_account}-${AWS_REGION}"
          bucket="$deterministic_bucket"
          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            bucket="${TF_STATE_BUCKET_FALLBACK:-}"
          fi

          ecr="$(aws ssm get-parameter --name /oficina/infra/ecr/ordens --region "$AWS_REGION" --query 'Parameter.Value' --output text)"
          aws ssm get-parameter --name /oficina/infra/k8s/instance-id --region "$AWS_REGION" >/dev/null
          aws ssm get-parameter --name /oficina/infra/services/ordens/target-group-arn --region "$AWS_REGION" >/dev/null
          aws secretsmanager describe-secret --secret-id /oficina/ordens/runtime-db >/dev/null
          aws secretsmanager describe-secret --secret-id /oficina/ordens/migration-db >/dev/null

          # Tag imutavel derivada do commit. latest esta proibido.
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "bucket=${bucket}"
            echo "ecr=${ecr}"
            echo "image_tag=${image_tag}"
            echo "runtime_image=${ecr}:${image_tag}"
            echo "migration_image=${ecr}:${image_tag}-migration"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images
        run: |
          docker build -f Dockerfile -t "${{ steps.platform.outputs.runtime_image }}" .
          docker build -f Dockerfile.migration -t "${{ steps.platform.outputs.migration_image }}" .

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.platform.outputs.runtime_image }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan migration image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.platform.outputs.migration_image }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push images
        run: |
          docker push "${{ steps.platform.outputs.runtime_image }}"
          docker push "${{ steps.platform.outputs.migration_image }}"

      - name: Deploy to K3s
        shell: pwsh
        run: |
          ./scripts/deploy-k3s.ps1 `
            -RuntimeImage "${{ steps.platform.outputs.runtime_image }}" `
            -MigrationImage "${{ steps.platform.outputs.migration_image }}" `
            -AwsRegion "$env:AWS_REGION" `
            -CommitSha "$env:GITHUB_SHA" `
            -RunId "$env:GITHUB_RUN_ID" `
            -RunAttempt "$env:GITHUB_RUN_ATTEMPT" `
            -StateBucket "${{ steps.platform.outputs.bucket }}" `
            -Transport "$env:MANIFEST_TRANSPORT"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Ordens Deploy"
            echo
            echo "- Job status: ${{ job.status }}"
            echo "- Commit SHA: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "- ECR repository: ${{ steps.platform.outputs.ecr }}"
            echo "- Runtime image tag: ${{ steps.platform.outputs.image_tag }}"
            echo "- Migration image tag: ${{ steps.platform.outputs.image_tag }}-migration"
            echo "- Service: oficina-ordens-servico"
            echo "- NodePort: 30082"
            echo "- Manifest transport: ${MANIFEST_TRANSPORT}"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Target group: healthy"
            else
              echo "- Target group: not confirmed"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
