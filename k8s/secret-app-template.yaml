# Template do Secret de aplicacao do oficina-ordens-servico.
# O valor e preenchido dentro da EC2, a partir do Secrets Manager, no comando de
# Deploy. Este arquivo nunca contem valor secreto e por isso pode viajar no
# pacote de manifests.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-ordens-servico-database-app
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: oficina-ordens-servico
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
type: Opaque
data:
  ConnectionStrings__DefaultConnection: __APP_CONNECTION_STRING__