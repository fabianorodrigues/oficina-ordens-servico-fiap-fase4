# Template do Secret de migration do oficina-ordens-servico.
# Secret separado do de aplicacao por decisao: um Secret unico servindo os dois
# workloads entregaria ao runtime a credencial que altera schema.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-ordens-servico-database-migration
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: oficina-ordens-servico
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: oficina
type: Opaque
data:
  ConnectionStrings__DefaultConnection: __MIGRATION_CONNECTION_STRING__