name: oficina-fiap-fase4-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - oficina-local

  sql-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      CADASTRO_DB_PASSWORD: ${CADASTRO_DB_PASSWORD}
      ESTOQUE_DB_PASSWORD: ${ESTOQUE_DB_PASSWORD}
      ORDENS_DB_PASSWORD: ${ORDENS_DB_PASSWORD}
    volumes:
      - ./docker/sql-init:/scripts:ro
    command: ["/bin/bash", "/scripts/init-sql.sh"]
    networks:
      - oficina-local
    restart: "no"

  payment-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "127.0.0.1:${WIREMOCK_HTTP_PORT}:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - oficina-local

  localstack:
    image: localstack/localstack:3.7
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${LOCALSTACK_HTTP_PORT}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q 'sqs' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - oficina-local

  localstack-init:
    image: amazon/aws-cli:2.17.58
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      LOCALSTACK_ENDPOINT: http://localstack:4566
    volumes:
      - ./docker/localstack:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-queues.sh"]
    networks:
      - oficina-local
    restart: "no"

  cadastro-api:
    build:
      context: ../oficina-cadastro-fiap-fase4
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Authentication__Mode: ${AUTHENTICATION_MODE}
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS}
      ConnectionStrings__OficinaCadastroDb: Server=sqlserver,1433;Database=OficinaCadastroDb;User Id=oficina_cadastro_app;Password=${CADASTRO_DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      LocalInfrastructure__Enabled: ${LOCAL_INFRASTRUCTURE_ENABLED:-false}
      LocalInfrastructure__Auth__Enabled: ${LOCAL_AUTH_ENABLED:-false}
      LocalInfrastructure__Auth__SigningKey: ${LOCAL_AUTH_SIGNING_KEY:-}
      LocalInfrastructure__SeedAdmin__Enabled: ${LOCAL_SEED_ADMIN_ENABLED:-false}
      LocalInfrastructure__SeedAdmin__ResetPassword: ${LOCAL_SEED_ADMIN_RESET_PASSWORD:-true}
      LocalInfrastructure__SeedAdmin__Cpf: ${LOCAL_ADMIN_CPF:-}
      LocalInfrastructure__SeedAdmin__Password: ${LOCAL_ADMIN_PASSWORD:-}
      LocalInfrastructure__SeedAdmin__Name: ${LOCAL_ADMIN_NAME:-Administrador Local}
    ports:
      - "127.0.0.1:${CADASTRO_HTTP_PORT}:8080"
    depends_on:
      sql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - oficina-local

  estoque-api:
    build:
      context: ../oficina-estoque-fiap-fase4
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Authentication__Mode: ${AUTHENTICATION_MODE}
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS}
      ConnectionStrings__OficinaEstoqueDb: Server=sqlserver,1433;Database=OficinaEstoqueDb;User Id=oficina_estoque_app;Password=${ESTOQUE_DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Messaging__Sqs__Enabled: ${MESSAGING_SQS_ENABLED}
      Messaging__Sqs__ServiceUrl: http://localstack:4566
      Messaging__Sqs__Region: ${AWS_REGION}
      Messaging__Sqs__AccessKey: ${AWS_ACCESS_KEY_ID}
      Messaging__Sqs__SecretKey: ${AWS_SECRET_ACCESS_KEY}
      Messaging__Sqs__CommandsQueueName: oficina-estoque-comandos.fifo
      Messaging__Sqs__CommandsDlqQueueName: oficina-estoque-comandos-dlq.fifo
      Messaging__Sqs__EventsQueueName: oficina-ordens-eventos.fifo
    ports:
      - "127.0.0.1:${ESTOQUE_HTTP_PORT}:8080"
    depends_on:
      sql-init:
        condition: service_completed_successfully
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - oficina-local

  ordens-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Authentication__Mode: ${AUTHENTICATION_MODE}
      Database__ApplyMigrations: ${DATABASE_APPLY_MIGRATIONS}
      ConnectionStrings__OficinaOrdensServicoDb: Server=sqlserver,1433;Database=OficinaOrdensServicoDb;User Id=oficina_ordens_app;Password=${ORDENS_DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Integrations__Cadastro__BaseUrl: http://cadastro-api:8080
      Integrations__Estoque__BaseUrl: http://estoque-api:8080
      Payments__BaseUrl: http://payment-mock:8080
      Payments__Mode: Api
      Payments__TimeoutSeconds: "5"
      Payments__Scenario: ${PAYMENTS_SCENARIO:-aprovado}
      DistributedFlow__Enabled: "true"
      Messaging__Sqs__Enabled: ${MESSAGING_SQS_ENABLED}
      Messaging__Sqs__ServiceUrl: http://localstack:4566
      Messaging__Sqs__Region: ${AWS_REGION}
      Messaging__Sqs__AccessKey: ${AWS_ACCESS_KEY_ID}
      Messaging__Sqs__SecretKey: ${AWS_SECRET_ACCESS_KEY}
      Messaging__Sqs__EventsQueueName: oficina-ordens-eventos.fifo
      Messaging__Sqs__EventsDlqQueueName: oficina-ordens-eventos-dlq.fifo
      Messaging__Sqs__CommandsQueueName: oficina-estoque-comandos.fifo
    ports:
      - "127.0.0.1:${ORDENS_HTTP_PORT}:8080"
    depends_on:
      cadastro-api:
        condition: service_healthy
      estoque-api:
        condition: service_healthy
      payment-mock:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - oficina-local

  local-gateway:
    image: node:20-alpine
    environment:
      CADASTRO_BASE_URL: http://cadastro-api:8080
      ESTOQUE_BASE_URL: http://estoque-api:8080
      ORDENS_BASE_URL: http://ordens-api:8080
      LOCAL_AUTH_SIGNING_KEY: ${LOCAL_AUTH_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:${LOCAL_GATEWAY_HTTP_PORT}:8080"
    volumes:
      - ./docker/local-gateway/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]
    depends_on:
      cadastro-api:
        condition: service_healthy
      estoque-api:
        condition: service_healthy
      ordens-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - oficina-local

  newman:
    image: postman/newman:6-alpine
    profiles: ["validation"]
    depends_on:
      local-gateway:
        condition: service_healthy
    volumes:
      - ./postman:/etc/newman:ro
      - ./artifacts/newman:/newman
    command:
      [
        "run",
        "/etc/newman/oficina-main-flow.postman_collection.json",
        "-e",
        "/etc/newman/oficina-main-flow.local.postman_environment.json",
        "--reporters",
        "cli,json",
        "--reporter-json-export",
        "/newman/oficina-main-flow-results.json"
      ]
    networks:
      - oficina-local

networks:
  oficina-local:
    driver: bridge

volumes:
  sqlserver-data:
  localstack-data:
